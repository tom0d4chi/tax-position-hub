{% extends "base.html" %}{% block body %}<h1>Utilisateurs</h1><div class="sub">Gestion des accès et des rôles</div>
<div class="card"><table><tr><th>Nom</th><th>Email</th><th>Rôle</th><th></th></tr>{% for u in rows %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ ROLES[u.role] }}</td>
<td>{% if u.id!=me.id %}<form method="post" action="/users/{{u.id}}/toggle"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="btn sec sm">{{ 'Désactiver' if u.active else 'Réactiver' }}</button></form>{% endif %}</td></tr>{% endfor %}</table></div>
<div class="card"><h2>Nouvel utilisateur</h2><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><div class="row r2"><div class="f"><label>Nom</label><input name="name" required></div><div class="f"><label>Email</label><input name="email" type="email" required></div></div>
<div class="row r2"><div class="f"><label>Rôle</label><select name="role">{% for k,v in ROLES.items() %}<option value="{{k}}">{{ v }}</option>{% endfor %}</select></div><div class="f"><label>Mot de passe (10 car. min.)</label><input name="password" type="text" minlength="10" required></div></div><button class="btn">Créer</button></form></div>{% endblock %}
